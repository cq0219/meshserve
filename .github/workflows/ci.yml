# MeshServe CI 流水线
# 触发：push（main + PR）+ 手动
# 结构：
#   1. lint    — 静态检查（golangci-lint + go vet + gofmt）
#   2. unit    — 单元测试 + 覆盖率 + 竞态检测（Linux/amd64）
#   3. build   — 三平台交叉编译验证
#   4. e2e     — 双节点集成测试（fake 引擎，真实进程组网）
#   5. release — 打 tag 时构建发布资产（三平台二进制 + 校验和）

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  GO_VERSION: "1.25"
  GOPROXY: https://goproxy.cn,direct

jobs:
  # ============ 1. 静态检查 ============
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 格式检查
        run: |
          test -z "$(gofmt -l .)" || (echo "以下文件未通过 gofmt:"; gofmt -l .; exit 1)

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.2
          args: --timeout=5m --enable=errcheck,govet,ineffassign,staticcheck,unused,gosimple

      - name: 漏洞扫描
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ============ 2. 单元测试 + 覆盖率 ============
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 单元测试（race）
        run: go test -race -count=1 ./...

      - name: 覆盖率统计（不含 race，规避 covdata 缺陷）
        run: |
          COV=$(go test -count=1 -cover ./internal/... 2>/dev/null | awk -F'coverage: ' '/coverage:/{split($2,a,"%"); s+=a[1]; n++} END {if(n>0) printf "%.1f", s/n; else print "0"}')
          echo "整体覆盖率: ${COV}%"
          if [ -z "$COV" ] || [ "${COV%.*}" -lt 50 ]; then
            echo "::error::覆盖率低于 50% 门禁（当前 ${COV}%）"; exit 1
          fi

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # ============ 3. 交叉编译 ============
  build:
    name: Cross-Compile
    runs-on: ubuntu-latest
    needs: [lint, unit]
    strategy:
      matrix:
        os: [linux, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 交叉编译 (${{ matrix.os }}/${{ matrix.arch }})
        run: |
          OUT="bin/meshserve"
          [ "${{ matrix.os }}" = "windows" ] && OUT="${OUT}.exe"
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -ldflags="-s -w" -o "$OUT" ./cmd/meshserve

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: meshserve-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/meshserve*
          retention-days: 7

  # ============ 4. 双节点集成测试 ============
  e2e:
    name: E2E (Two-Node)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 编译测试二进制
        run: |
          mkdir -p bin
          go build -o bin/meshserve ./cmd/meshserve

      - name: 双节点集成测试（真实进程组网）
        run: go test -tags=integration -count=1 -v ./test/e2e/

  # ============ 5. 发布（tag 触发） ============
  release:
    name: Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 构建发布资产
        run: make build-all VERSION=${{ github.ref_name }}

      - name: 生成校验和
        working-directory: bin/release
        run: sha256sum meshserve-* > SHA256SUMS

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/release/meshserve-*
            bin/release/SHA256SUMS
          generate_release_notes: true
